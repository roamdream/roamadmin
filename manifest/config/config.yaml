# RoamAdmin 统一配置（多环境可覆盖：config.yaml → config.${RA_ENV}.yaml）
server:
  address: ":8600"
  openapiPath: "/api.json"
  # API 文档界面（Scalar，在线调试）由 kernel/swaggerui 内嵌提供，固定挂在 /swagger，
  # 无需（也不应）在此配置 swaggerPath，以免与内嵌 UI 的路由冲突。
  dumpRouterMap: false
  readTimeout: "60s"
  writeTimeout: "60s"
  idleTimeout: "120s"
  maxHeaderBytes: "1MB"

logger:
  level: "all"
  stdout: true
  path: "logs"
  file: "{Y-m-d}.log"
  rotateSize: "100MB"

# 数据库：MySQL 8 / PostgreSQL 一键切换（type: mysql | pgsql）
database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    name: "roamadmin"
    user: "root"
    pass: "root"
    charset: "utf8mb4"
    # 时区：UTC。数据库统一存储 UTC，接口统一返回 RFC3339(UTC)，前端转本地时区显示。
    timezone: "UTC"
    debug: false
    # 高并发推荐值（内核已收敛默认，运维可调）
    maxOpenConnCount: 200
    maxIdleConnCount: 50
    maxConnLifeTime: "3600s"
    maxIdleConnTime: "600s"
    # 操作级超时（gdb 原生支持，防慢 SQL 拖垮连接池）
    queryTimeout: "30s"
    execTimeout: "30s"
    tranTimeout: "60s"
  # 读写分离 / 多数据源：新增组即可，业务侧 db.Instance("group") 取用
  # slave:
  #   type: "mysql"
  #   ...

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""
    minIdle: 5
    maxIdle: 50
    maxActive: 200
    maxConnLifetime: "3600s"
    # 连接池超时：waitTimeout 必须设置（默认 0 表示池耗尽时永久阻塞，高并发高危）
    idleTimeout: "30s"
    waitTimeout: "5s"

# 认证鉴权
auth:
  jwt:
    secret: "please-change-me-in-production"
    issuer: "roamadmin"
    expireSeconds: 7200

# 协程池（内核 goroutine pool，缺省 10000）
pool:
  size: 10000

# 雪花主键节点号：多实例部署时每个实例设不同值（0..1023），避免主键冲突
snowflake:
  nodeId: 1

# 操作审计：全局自动采集 /api/v1/* 操作轨迹，异步批量落库 ra_oper_log（安全审计/追踪）
audit:
  enabled: true           # 总开关
  logGet: false           # 是否也记录 GET 读请求（默认只记写操作 + 失败请求）
  bodyCapture: true       # 是否采集 JSON 请求体（写操作 / JSON 请求）
  bodyMaxLen: 2048        # 请求体脱敏后最大长度（字符）
  sensitiveKeys:          # 请求体敏感字段（脱敏为 ***，大小写不敏感）
    - password
    - oldPassword
    - newPassword
    - token
    - secret
  queueSize: 4096         # 内存缓冲队列容量（满则丢弃并告警）
  batchSize: 100          # 批量写库的每批条数
  flushInterval: "500ms"  # 批量刷新间隔
  retentionDays: 90       # 日志保留天数（0 表示永久保留）

# 消息总线：local（进程内内存）| redis-streams（Redis Streams 落库，跨实例消费）
mq:
  type: local
  streams:
    group: ra            # 消费者组
    consumer: ""         # 消费者名（多实例需唯一；留空自动 hostname-pid）
    maxLen: 100000       # 主流长度近似上限
    dlqMaxLen: 100000    # 死信流长度近似上限
    blockTimeout: "5s"   # XREADGROUP 阻塞时长

# MQTT 内嵌 Broker（gateway 模块启动）
mqtt:
  # 是否启用内嵌 broker（false 时 gateway 仅注册状态接口，不监听端口）
  enabled: true
  # TCP 监听地址（供设备直连；生产可用 TLS 监听器替换）
  address: ":1883"
