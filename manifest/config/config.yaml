# RoamAdmin 统一配置（多环境可覆盖：config.yaml → config.${RA_ENV}.yaml）
server:
  address: ":8600"
  openapiPath: "/api.json"
  # API 文档界面（Scalar，在线调试）由 kernel/swaggerui 内嵌提供，固定挂在 /swagger，
  # 无需（也不应）在此配置 swaggerPath，以免与内嵌 UI 的路由冲突。
  dumpRouterMap: false
  readTimeout: "60s"
  writeTimeout: "60s"
  idleTimeout: "120s"
  maxHeaderBytes: "1MB"

logger:
  level: "all"
  stdout: true
  path: "logs"
  file: "{Y-m-d}.log"
  rotateSize: "100MB"

# 数据库：MySQL 8 / PostgreSQL 一键切换（type: mysql | pgsql）
database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    name: "roamadmin"
    user: "root"
    pass: "root"
    charset: "utf8mb4"
    # 时区：UTC。数据库统一存储 UTC，接口统一返回 RFC3339(UTC)，前端转本地时区显示。
    timezone: "UTC"
    debug: false
    # 高并发推荐值（内核已收敛默认，运维可调）
    maxOpenConnCount: 200
    maxIdleConnCount: 50
    maxConnLifeTime: "3600s"
    maxIdleConnTime: "600s"
  # 读写分离 / 多数据源：新增组即可，业务侧 db.Instance("group") 取用
  # slave:
  #   type: "mysql"
  #   ...

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""
    minIdle: 5
    maxIdle: 50
    maxActive: 200
    maxConnLifetime: "3600s"

# 认证鉴权
auth:
  jwt:
    secret: "please-change-me-in-production"
    issuer: "roamadmin"
    expireSeconds: 7200

# MQTT 内嵌 Broker（gateway 模块启动）
mqtt:
  # 是否启用内嵌 broker（false 时 gateway 仅注册状态接口，不监听端口）
  enabled: true
  # TCP 监听地址（供设备直连；生产可用 TLS 监听器替换）
  address: ":1883"
